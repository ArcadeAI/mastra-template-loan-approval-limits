name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests are the `test` shards below since #38; this job keeps the rest of
  # what it always ran, in the same order.
  check:
    name: typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the Dockerfiles run, so CI and the deployed
          # images cannot disagree about the runtime.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # One install covers every workspace. The identity provider is part of
      # the app since #6 (lib/identity/provider), so the root install and the
      # root typecheck reach it; it has no install or typecheck of its own.
      - name: Typecheck
        run: bun run typecheck

      # The hook contract is generated from a vendored copy of Arcade's OpenAPI
      # document. `bun test` catches a stale committed file too, but this step
      # names the cause and the fix instead of failing as an opaque string diff.
      - name: Hook contract is regenerated from the vendored spec
        run: bun run --cwd packages/policy-schema generate:check

      # idp.db's schema is generated from the installed Better Auth. A stale
      # file fails `bun test` too, but this names the fix.
      - name: idp schema is regenerated from the installed Better Auth
        run: bun run generate:identity-schema:check

      # `bun test` and `tsc` never exercise the app's build, and a Next.js
      # build is where most of this service's failures show up. The app is the
      # repo root since #3, so the root `build` is `next build` (plus the
      # workspaces' no-op builds).
      - name: Build web
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # `bun test`, in four shards that run side by side (#38). Serially it was 148
  # files and 502s of an eight-minute job (run 36230453689), most of it the few
  # files that each boot a Next server and a Chrome. `scripts/test-shards.ts`
  # splits the tracked test files by the seconds measured on a CI run
  # (`scripts/test-weights.json`), heaviest first onto the lightest shard, and
  # deals files with no weight yet round-robin; every job computes the same
  # split. Each shard sets up everything the whole suite needed, so no file
  # depends on which shard it landed in.
  test:
    name: test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so `tests ran` sees all four records.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # `app-test/home-loan-next-browser.test.ts` drives the real Next page
      # in a real headless Chrome. Until #152 it looked only for the macOS
      # application bundle, so on this runner it skipped — and a regression that
      # skips in the environment that gates merges is a regression that is not
      # run. Chrome is installed here so the test is required rather than
      # optional: `test/chrome.ts` treats a missing browser on CI as a failure,
      # never a skip. No paid infrastructure and no secrets; the action fetches a
      # public build, and the test itself talks to nothing but loopback.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Mastra Studio runs under Node, not Bun, and `mastra` and `@mastra/core`
      # need Node 22.13 or later. `app-test/studio-entry.test.ts` imports the
      # Studio entry with `node` and `app-test/studio-dev-server.test.ts` boots
      # `mastra dev`, so the Node on PATH is pinned here rather than left to
      # whatever the runner image ships (#8).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `run` is `bun test` on this shard's files with a preload that writes
      # down every file Bun loaded (`scripts/test-shards-record.ts`), and it
      # keeps Bun's output. Its exit status is Bun's.
      - name: Test
        run: bun scripts/test-shards.ts run ${{ matrix.shard }} 4 test-shard-${{ matrix.shard }}
        env:
          # Explicit rather than trusting discovery to agree with whatever the
          # action put on PATH. A wrong value here fails loudly by design.
          CG_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      # Uploaded whether the shard passed or not: a failed shard's record is
      # what `tests ran` reports its counts from.
      - name: Keep what ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ matrix.shard }}
          path: test-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  # Four green shards do not say the suite ran: a file the split dropped, or
  # one that died while it was imported, leaves every shard green. This fails
  # unless the files the shards actually loaded are exactly the tracked test
  # files, each once, and on any failed test or Bun "error" in any shard. It
  # prints each shard's pass/skip/fail counts and its five slowest files. It
  # runs whatever the shards concluded (`always()`), so a red shard still gets
  # its counts printed here.
  tests-ran:
    name: tests ran
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Fetch every shard's record
        uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: shards

      # No install: the check reads the records and `git ls-files`, and imports
      # nothing but Bun and Node built-ins.
      - name: Every tracked test file ran exactly once
        run: bun scripts/test-shards.ts check shards 4

  # The toolkits are discovered, never listed. `tools/approvals` is meant to be
  # deletable — a forker who wants no Python removes it and substitutes their
  # own tools — and a matrix that named it would turn that supported act into a
  # job cd-ing into a directory that is not there.
  discover-toolkits:
    name: discover toolkits
    runs-on: ubuntu-latest
    outputs:
      toolkits: ${{ steps.find.outputs.toolkits }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        # The script answers `[]` and exits 0 when there is no toolkit, which
        # matters because this `run:` block is executed under `bash -e -o
        # pipefail`: a script that printed `[]` and exited 1 would fail the
        # step rather than reach the empty case. Measured on round 2 of #47.
        run: |
          toolkits="$(bash scripts/list-toolkits.sh)"
          echo "toolkits=$toolkits" >> "$GITHUB_OUTPUT"
          if [ "$toolkits" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT";
          else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "discovered: $toolkits"

  toolkits:
    name: test tools/${{ matrix.toolkit }}
    runs-on: ubuntu-latest
    needs: discover-toolkits
    # Skipped, not empty. GitHub rejects an empty matrix outright — a job whose
    # `matrix.toolkit` evaluates to `[]` is a workflow error, not a job with
    # nothing to do — so the empty case has to be caught here, before the
    # matrix is constructed. A repo with no Python toolkits left is a forked
    # template that deleted them on purpose, and it deserves a green run.
    if: needs.discover-toolkits.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Both toolkits are Python `arcade-mcp` packages shipped with
        # `arcade deploy`, so neither is covered by `bun test` above.
        toolkit: ${{ fromJSON(needs.discover-toolkits.outputs.toolkits) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Bun for every toolkit, not just the one that needs it today.
      # tools/loan's tests boot the real loan module (`scripts/loans.ts`) as a subprocess, and
      # its conftest *skips* when bun is missing — so a step guarded on a
      # toolkit name would, the day that name changed, silently stop running
      # the tests instead of failing. Installing unconditionally costs seconds
      # and cannot go quiet.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: tools/${{ matrix.toolkit }}
        run: uv run --frozen --extra dev pytest

  images:
    name: build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No loan-app image since #5 and no idp image since #6: the loan module
        # and the identity provider ship inside the web one.
        service: [web]
        include:
          # cg-web refuses to run without its two bearers under
          # NODE_ENV=production, and since #4 it holds both: it is the control
          # plane too (cg-hooks was folded in), so Arcade signs its hooks with
          # one and the deployed approvals toolkit and the approval page present
          # the other, and neither is accepted in the other's place. A control
          # plane that fell back to a known token would accept hook calls from
          # anyone. Without them the app still boots and /health still answers
          # 200 — degraded, naming the refusal — so the step below also checks
          # that the control plane's policy loaded, or this job would pass on an
          # image that governs nothing. Throwaway here; a deployment sets its
          # own, and neither is ever committed.
          #
          # Since #6 it is the identity provider too, which refuses to boot
          # under NODE_ENV=production without a BETTER_AUTH_SECRET, on purpose:
          # the secret encrypts the ID-token signing key at rest, and a boot
          # that silently fell back to a known key would be worse than no boot.
          # The app stays up and reports `identity: failed`, so the step checks
          # that the identity provider booted as well as the policy.
          - service: web
            dockerfile: ./Dockerfile
            smoke_env: >-
              -e ARCADE_HOOK_SIGNING_SECRET=ci-smoke-only-not-a-real-secret
              -e APPROVALS_STORE_TOKEN=ci-smoke-only-not-a-real-token
              -e BETTER_AUTH_SECRET=ci-smoke-only-not-a-real-secret-0000
            smoke_expect: '"policy":{"status":"ready"'
            smoke_expect_also: '"identity":{"status":"ok"'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The app ships as the one hand-written root Dockerfile, so without this
      # the container path is only ever exercised by somebody's deploy. A
      # workspace added without its matching
      # `COPY packages/<new>/package.json` line would keep CI green and then
      # fail `bun install --frozen-lockfile` inside the image at deploy time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The web app's Dockerfile is at the root since #3, and since #6 it is
          # the only one: the control plane (#4), the loan module (#5) and the
          # identity provider (#6) ship inside it.
          file: ${{ matrix.dockerfile || format('./apps/{0}/Dockerfile', matrix.service) }}
          push: false
          load: true
          tags: cg-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # A Dockerfile that builds is not an image that serves. A `COPY` narrowed
      # to the wrong set of files builds green and dies on boot, so boot it and
      # ask the same question a hosting platform's health check asks. No database, no
      # network beyond localhost: every service seeds or stubs on its own.
      - name: Boot and check /health
        run: |
          docker run -d --name svc -p 8080:8080 -e PORT=8080 ${{ matrix.smoke_env }} cg-${{ matrix.service }}:ci
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8080/health); then
              echo "$body"
              for expect in '${{ matrix.smoke_expect }}' '${{ matrix.smoke_expect_also }}'; do
                if [ -n "$expect" ] && ! grep -qF "$expect" <<<"$body"; then
                  echo "::error::${{ matrix.service }}'s /health does not contain $expect"
                  docker logs svc
                  exit 1
                fi
              done
              exit 0
            fi
            sleep 1
          done
          echo "::error::${{ matrix.service }} did not answer /health"
          docker logs svc
          exit 1

      # A boot is not a served file either. `public/` does not travel with
      # `output: "standalone"` on its own, and #177's co-brand frame is the
      # first thing in this repo to need it: both wordmarks rendered under
      # `next dev` and answered 404 in the artifact, which would have put a
      # frame with two broken images on a projector. `next.config.ts` carries
      # the directory in the file trace and
      # `app-test/public-assets.test.ts` proves that against the locally
      # built tree — but only on whatever machine ran it. This is the same
      # claim on Alpine, against the image, and it is derived from the
      # directory rather than from the two file names, so the next asset
      # added is covered by having been added.
      - name: cg-web serves public/
        if: matrix.service == 'web'
        run: |
          files="$(cd public && find . -type f | sed 's|^\./||' | sort)"
          if [ -z "$files" ]; then
            echo "::error::public/ is empty, so this step asserted nothing"
            exit 1
          fi
          body="$(mktemp)"
          status=0
          while IFS= read -r file; do
            code="$(curl -s -o "$body" -w '%{http_code}' "http://localhost:8080/$file")"
            served="$(wc -c < "$body" | tr -d ' ')"
            source="$(wc -c < "public/$file" | tr -d ' ')"
            if [ "$code" = "200" ] && cmp -s "$body" "public/$file"; then
              echo "/$file  200  $served bytes, byte-for-byte"
            else
              echo "::error::/$file answered $code with $served bytes; the file is $source bytes"
              status=1
            fi
          done <<< "$files"
          exit "$status"
