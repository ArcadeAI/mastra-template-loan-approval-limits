# One blueprint provisions the one service Render is responsible for: `web`.
# The control plane was a second, `cg-hooks`, until #4 folded it into the app:
# cg-web serves /hooks/access, /hooks/pre, /hooks/post, /hooks/events and the
# approvals store itself, and owns governance.db on its own disk. The loan API
# was a third, `cg-loan-app`, until #5 folded it in too: cg-web serves it under
# /bank and owns loans.db on the same disk. The identity provider was a
# fourth, `cg-idp`, until #6: cg-web serves the OAuth endpoints, the login and
# consent pages and /identity/*, and owns idp.db on the same disk. `tools/loan` and
# `tools/approvals` are deliberately absent — they are Python `arcade-mcp` toolkits and ship via
# `arcade deploy`.
#
# Every service uses runtime: docker. Render does not detect Bun, so the
# runtime is declared explicitly rather than left to detection.
#
# Data persists; resetting is something you deliberately run. Decided on #29,
# replacing the earlier "/tmp plus seed-on-boot, so redeploying is the reset"
# model: each database-owning service mounts a disk and seeds from its fixture
# only when the database has no schema, so a policy edited on stage and a loan
# approved on stage are both still there after a restart. Getting back to a
# clean state is `bun run reset` (#23), which calls each service's own
# `POST /admin/reset` under the shared `RESET_TOKEN` below. **A redeploy is not
# a reset** — the disks survive it — and **a reset is not a re-registration**:
# nothing resets the OAuth client Arcade holds, and deleting `idp.db` would.
# `docs/RUNBOOK.md` is the operational half of this file.
#
# cg-web owns every database — governance.db since #4, loans.db since #5,
# idp.db since #6 — on the one disk below.
#
# Services with disks give up zero-downtime deploys — Render stops the old
# instance before starting the new one. Irrelevant for a demo.
#
# Cross-service addresses are host-form, and every one of them is `sync: false`:
# the value is READ OFF THE RENDER SERVICE PAGE, never derived and never
# guessed. Two measurements say why, and they pull in opposite directions.
#
# Guessing is wrong because onrender.com subdomains are global, so a taken
# service name gets silently suffixed: in the live environment `cg-web` is
# `cg-web-sa31` (and `cg-idp` was `cg-idp-or5b`). Hardcoding `cg-web.onrender.com`
# would have addressed a stranger's deployment, and for a while the loan API
# was validating bearer tokens against a colleague's IdP.
#
# Deriving is wrong because `fromService … property: host` emits the BARE
# SERVICE NAME, not the hostname — measured 2026-09-10 on #59. The loan API's
# identity host arrived as `cg-idp-or5b`, consumers prepend a scheme and nothing else, and
# every request went to `https://cg-idp-or5b/…` where DNS fails. Blueprints have
# no string interpolation, so no expression here can add `.onrender.com`.
#
# What is left is the value a human copies from the service's page, once per
# environment. Each consumer refuses a host that still looks like a bare service
# name at boot (`lib/**/public-host.ts`), so a wrong one fails loudly and
# immediately rather than as a network error against a healthy dependency.
#
# Secrets are `sync: false` too, so a blueprint sync prompts for them instead of
# putting them in git. See `.env.example` for where to obtain each one.

services:
  # Next.js: chat, persona switcher, approval page, control-plane panel. The
  # Mastra agent runs in this service's route handlers.
  - type: web
    name: cg-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Answers 200 whatever it finds (#112), and since #4 that includes the
    # control plane: a policy that will not compile is `status: degraded` with
    # the compile error in the body, never a 503 that takes the instance out of
    # rotation and turns a control plane failing closed into one that is gone.
    healthCheckPath: /health
    autoDeployTrigger: commit
    # governance.db, since #4 folded cg-hooks in, loans.db, since #5 folded
    # cg-loan-app in, and idp.db, since #6 folded cg-idp in: one disk, three
    # files, each owned by one module. Each is seeded from its fixture only
    # when it has no schema; after that, a rule edited on stage and a loan
    # approved on stage survive a restart and a redeploy. Resetting is
    # `bun run reset` (#23), never a redeploy. 1 GB, the minimum. Deleting this
    # block runs all three ephemerally, re-seeded on every boot — and for
    # idp.db that costs more than the others: the OAuth client credentials
    # Arcade holds live in it, so every restart regenerates them and the
    # registration in the Arcade dashboard goes stale.
    disk:
      name: governance
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      # --- the control plane (#4, was cg-hooks) -----------------------------
      # On the disk above, not /tmp.
      - key: GOVERNANCE_DB_PATH
        value: /data/governance.db
      # The bearer token Arcade presents on /access, /pre and /post. Set the
      # same value on the hook extension in the Arcade dashboard (#13). A
      # different secret from APPROVALS_STORE_TOKEN on purpose: neither is
      # accepted in the other's place.
      - key: ARCADE_HOOK_SIGNING_SECRET
        sync: false
      # --- the loan module (#5, was cg-loan-app) ----------------------------
      # On the disk above, not /tmp. The module creates the parent directory,
      # so this also works unchanged against a bind mount or a local path.
      - key: LOANS_DB_PATH
        value: /data/loans.db
      # No IDENTITY_HOST here since #6: the loan module validates bearer
      # tokens at this service's own /oauth2/userinfo, over its local listener
      # (`localhost:$PORT`, the code's default), never through the public host.
      # --- the agent (#14) --------------------------------------------------
      # A Mastra agent in a route handler reaches the loan tools through the
      # gateway as the signed-in persona. DESIGN.md → Model, Integration.
      #
      # Pinned here rather than left to the code's default so the blueprint is
      # the whole list. Swapping the model is this line and a redeploy.
      - key: MODEL_ID
        value: claude-sonnet-5
      # SECRET. console.anthropic.com → Settings → API keys. Without it `/chat`
      # answers 503 naming this variable and /health reports
      # `"agent": "missing"`, because a deployment that signs Alice in and then
      # cannot run a turn is not `ok`.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ARCADE_API_KEY
        sync: false
      - key: ARCADE_GATEWAY_ID
        sync: false
      # `tool.toolkit` as Arcade files the deployed loan toolkit — `Loan`,
      # measured on #35, the same value the control plane reads. Here it is half of an
      # ALLOW-LIST: the agent is given the tools whose wire names start with
      # `Loan_` or `Approvals_` and nothing else, so a live tools/list's eight
      # entries become six and the gateway's own `System_ManageAuthorization`
      # and `Arcade_ListApps` never reach the model.
      #
      # Both halves, not just this one (#89). The pre-hook's own denial tells
      # the model to call `Approvals_RequestApproval`; an agent holding the loan
      # toolkit alone is being told to call a tool it cannot see, and measured
      # on #14 it refuses the instruction rather than acting on it. See
      # ARCADE_APPROVALS_TOOLKIT further down this service's list.
      #
      # A wrong value here selects nothing, and `/chat` answers 502 naming this
      # variable rather than letting a model with no tools answer fluently
      # about a loan book it never read.
      - key: ARCADE_LOAN_TOOLKIT
        sync: false
      # --- identity (#82, and the provider itself since #6, was cg-idp) -----
      # This service is the identity provider — Better Auth as an OAuth 2.1
      # authorization server, the login and consent pages, /identity/health
      # and /identity/admin/reset — and signs each persona in against it under
      # its own OAuth client ("client C"), then drives the gateway OAuth itself
      # and answers Arcade's custom user verifier. DESIGN.md → Identity and
      # OAuth. The issuer is this service's own origin, APP_PUBLIC_HOST below.
      #
      # On the disk above, not /tmp. The module creates the parent directory.
      # **Never delete idp.db**: the OAuth client credentials Arcade holds are
      # in it, and deleting it IS a rotation, failing at the authorize step
      # where no hook fires and the panel stays dark.
      - key: IDP_DB_PATH
        value: /data/idp.db
      # Signs Better Auth's sessions and encrypts the stored signing key.
      # Generated once by Render and never shown; rotating it signs every
      # persona out and makes the stored signing key unreadable. Required in
      # production: without it the identity module refuses to boot, /health
      # reports `identity: failed`, and every browser reads as signed out.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Arcade's OAuth callback, allowlisted on the `arcade` client (hop 2).
      # The default in the code is Arcade Cloud's; set this if the dashboard
      # shows another.
      - key: IDP_OAUTH_REDIRECT_URIS
        sync: false
      # One OAuth client per relying party, by key (#79). `web` is client C —
      # this service's own sign-in (#82) — alongside the `arcade` client the
      # Arcade dashboard is registered against; `arcade-user-source` is the
      # User Source's (hop 1). Give each its own allowlist below; a client
      # without a per-key override falls back to IDP_OAUTH_REDIRECT_URIS, which
      # is Arcade's hop-2 callback.
      #
      # A secret is printed exactly once, by
      # `bun run oauth-client --client <key> --rotate` in this service's shell.
      - key: IDP_OAUTH_CLIENTS
        sync: false
      # `https://<APP_PUBLIC_HOST>/api/auth/callback`. An OAuth redirect URI is
      # matched byte for byte, and a mismatch is refused at the authorize step,
      # where no hook fires and the panel stays dark.
      - key: IDP_OAUTH_REDIRECT_URIS_WEB
        sync: false
      # Client C, minted by adding `web` to IDP_OAUTH_CLIENTS and running
      # `bun run oauth-client --client web --rotate` in this service's shell.
      # It prints the secret exactly once (#70). Its redirect URI must be
      # allowlisted as `https://<APP_PUBLIC_HOST>/api/auth/callback` via
      # IDP_OAUTH_REDIRECT_URIS_WEB above. Separate from the two
      # registrations Arcade holds — one client per relying party, settled on
      # #75/#79.
      - key: IDP_CLIENT_ID
        sync: false
      - key: IDP_CLIENT_SECRET
        sync: false
      # Seals the per-browser session cookie (AES-256-GCM), which carries the
      # persona's email and their gateway access and refresh tokens. Run
      # `openssl rand -hex 32` and paste the result; nothing else produces a
      # value this service will accept.
      #
      # At least 32 characters, and at least 8 distinct ones. That floor is
      # enforced, not advised: below it /health reports signin, gateway and
      # verifier all `missing` and every identity route answers 503 naming the
      # minimum. `SESSION_SECRET=x` used to be accepted, and a guessable key
      # over two bearer tokens with every surface reporting `configured` is the
      # silent control this project argues against.
      #
      # Rotating it signs every browser out. That is the whole blast radius.
      - key: SESSION_SECRET
        sync: false
      # The three below have working defaults in the code and are named here so
      # the blueprint is the whole list rather than most of it. **Leave all
      # three blank on cg-web**; each comment says the one case for setting it.
      #
      # What sign-in asks the identity provider for. Defaults to `openid email`. `email` is the
      # join key between Arcade's user_id, the OAuth subject and the loan book's
      # actor column, so a value here that omits it breaks identity rather than
      # narrowing it. Set it only to ask for more, never fewer.
      #
      # There is now one reason to ask for more. Since #157 cg-web keeps that
      # access token and reads the loan book with it, and measured 2026-09-18
      # against the provider: `openid email` returns **no** refresh token and a
      # 3600-second access token, while `openid email offline_access` returns
      # one and renews cleanly. The default is left alone because an hour
      # outlasts a webinar and an expired token is a plain re-sign-in prompt on
      # the card — never a denial and never a fault. Set
      # `openid email offline_access` here to have cg-web renew instead; it
      # adds one line to the consent screen a presenter sees once per browser.
      - key: IDP_SCOPES
        sync: false
      # Where `confirm_user` lives, which is NOT api.arcade.dev. Defaults to
      # https://cloud.arcade.dev, measured on spike #75. It exists so a test can
      # point the verifier's two calls at a stand-in without moving the
      # gateway's; set it only if Arcade Cloud moves.
      - key: ARCADE_CLOUD_URL
        sync: false
      # Pins the MCP client id hop 1 authorizes under, instead of letting cg-web
      # register one dynamically per process. Blank is correct and is what this
      # deployment starts with: there is no value to put here until a
      # registration exists.
      #
      # The one reason to fill it in later: Arcade renders its gateway consent
      # screen once per persona per MCP client id, so with this blank every
      # redeploy costs each persona one more consent click. If that becomes a
      # nuisance during rehearsal, pin it to a client id Arcade already knows.
      # Whether the dashboard lists the dynamically-registered client is
      # unmeasured — nobody has looked — so treat that as a thing to check
      # before relying on it, not as an instruction.
      - key: ARCADE_MCP_CLIENT_ID
        sync: false
      #
      # One step is not an environment variable at all: the Arcade dashboard's
      # Auth → Settings → Custom verifier route must be
      # `https://<APP_PUBLIC_HOST>/api/arcade/verify`. Without it Arcade uses its own
      # verifier, which demands an Arcade account that is a project member —
      # our personas are not, the grant binds to whoever is signed in at
      # account.arcade.dev, and the tool re-challenges forever with nothing on
      # the panel to say why (DESIGN.md open risk 4).
      # The approvals store's bearer (GET /api/approvals/{id} and the rest, served
      # by this service since #4), and the toolkit name Approvals.Decide is
      # executed under, which the approval page presses through Arcade. Set the
      # same store token as an Arcade secret uploaded by `arcade deploy` from
      # tools/approvals. A wrong toolkit name calls nothing.
      #
      # It is also the second half of the agent's allow-list (#89), which is why
      # it is required on this service rather than optional: without it the
      # agent cannot see the tool its own denial instructs it to call.
      - key: APPROVALS_STORE_TOKEN
        sync: false
      - key: ARCADE_APPROVALS_TOOLKIT
        sync: false
      - key: PERSONA_LOAN_OFFICER_EMAIL
        sync: false
      - key: PERSONA_CREDIT_ANALYST_EMAIL
        sync: false
      - key: PERSONA_VP_CREDIT_EMAIL
        sync: false
      - key: PERSONA_CHIEF_CREDIT_OFFICER_EMAIL
        sync: false
      # --- the control-plane panel's stream (#81) ---------------------------
      # Which stream /panel watches. Three states, and the panel says which one
      # it is in on screen:
      #
      #   hooks    the live control plane at APP_PUBLIC_HOST — this service
      #            itself since #4. Badge: `LIVE · <this service's host>`
      #   fixture  the built-in replay of #5's sequence. Badge: `FIXTURE REPLAY`
      #   unset    the replay under `next dev`; NO STREAM AT ALL when deployed —
      #            /panel renders an error state naming this variable and
      #            /health answers `"panel_stream":"unconfigured"`, `degraded`
      #
      # A plain value rather than `sync: false`, unlike almost everything else
      # here, because it is not a credential and not an address: `hooks` is what
      # a deployment of this blueprint is for, every time.
      #
      # It is declared here at all because it was not. Between #21 and #81 this
      # key was absent from the blueprint, an unset value silently meant the
      # replay, and on 2026-09-11 a human made a real governed call against the
      # live gateway and watched cg-web play the demo sequence over the top of
      # it. Nothing on the page or in /health said so. The fallback is gone; the
      # blueprint now says what it wants.
      - key: GOVERNANCE_STREAM
        value: hooks
      # APP_PUBLIC_HOST (#6): this service's own public host, and the one
      # Arcade tool secret the toolkits hold too. It replaced one host key per
      # service — the control plane's, the loan API's, the web UI's — which had
      # all been this service since #5. The panel watches /hooks/events on it,
      # the Loan toolkit calls /bank on it, the Approvals toolkit calls
      # /api/approvals on it and links to /approvals/<id> on it, and it is the
      # identity provider's OAuth issuer and the base of every redirect_uri.
      # Nothing on this service reads its own modules through it: those reads
      # are in-process or local.
      #
      # Server-side only, and no NEXT_PUBLIC_ twin on purpose: `next build`
      # inlines NEXT_PUBLIC_* into the client bundle, but Render supplies
      # service env vars at runtime — the value would be empty at build time
      # and the browser would get `undefined`. The control-plane panel gets
      # this host from a server component as a prop instead (#21).
      #
      # `sync: false`, and stays that way: onrender.com subdomains are global
      # and Render suffixes a name that is taken, so this cannot be derived or
      # guessed. Read it off the cg-web service page in the Render dashboard
      # (the host part of the URL shown there). The value reaches the browser,
      # so a bare service name fails in a visitor's DevTools rather than in a
      # log; `lib/public-host.ts` refuses one before that, and with
      # GOVERNANCE_STREAM=hooks above, leaving it blank is the error state
      # rather than a quiet replay.
      - key: APP_PUBLIC_HOST
        sync: false
      # The bearer POST /hooks/admin/reset requires (#106), served by this
      # service since #4, and POST /bank/admin/reset since #5, and POST
      # /identity/admin/reset since #6, so `bun run reset` presents one value
      # to all three. The identity reset clears people, sessions, tokens and
      # consents and never touches the OAuth client row or the signing keys,
      # asserting the client ids are unchanged. Held server-side only and never
      # sent to the browser: the panel's Reset button posts to a route in this
      # service, which presents the bearer. Leave it blank and /admin/reset
      # answers 404, /health says `reset: "disabled"`, and the button is not
      # rendered at all, which is the correct state for a deployment nobody is
      # presenting from.
      - key: RESET_TOKEN
        sync: false
